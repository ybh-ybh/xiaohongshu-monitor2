services:
  xiaohongshu-monitor:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - HEADLESS=${HEADLESS:-true}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-5}
      - XHS_USER_DATA_DIR=${XHS_USER_DATA_DIR:-./data/browser-profile}
      - MAIL_HOST=${MAIL_HOST:-smtp.163.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_SECURE=${MAIL_SECURE:-true}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_RECIPIENTS=${MAIL_RECIPIENTS}
      - MAIL_RECIPIENT=${MAIL_RECIPIENT}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
