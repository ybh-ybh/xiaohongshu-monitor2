services:
  xiaohongshu-monitor:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - LOG_REQUESTS=${LOG_REQUESTS:-true}
      - LOG_HEALTH_CHECKS=${LOG_HEALTH_CHECKS:-false}
      - SCRAPE_DEBUG_SCREENSHOT=${SCRAPE_DEBUG_SCREENSHOT:-false}
      - HEADLESS=${HEADLESS:-true}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-5}
      - XHS_USER_DATA_DIR=${XHS_USER_DATA_DIR:-./data/browser-profile}
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-true}
      - AUTH_SESSION_TTL_HOURS=${AUTH_SESSION_TTL_HOURS:-168}
      - MAIL_HOST=${MAIL_HOST:-smtp.163.com}
      - MAIL_PORT=${MAIL_PORT:-465}
      - MAIL_SECURE=${MAIL_SECURE:-true}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_RECIPIENTS=${MAIL_RECIPIENTS}
      - MAIL_RECIPIENT=${MAIL_RECIPIENT}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
